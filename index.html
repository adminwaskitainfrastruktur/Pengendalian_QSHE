<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- ─── Favicon & ikon ─── -->
    <link rel="icon" type="image/png" href="/logo-wki.png" />
    <link rel="apple-touch-icon" href="/logo-wki.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="description" content="Dashboard Pengendalian Proyek Waskita Infrastruktur" />

    <!-- ─── Open Graph ─── -->
    <meta property="og:title" content="Dashboard Pengendalian & QSHE" />
    <meta property="og:description" content="Monitoring real-time performa QSHE, RKAP, dan progres proyek infrastruktur seluruh Indonesia." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo-wki.png" />

    <!-- ─── Font ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Pengendalian & QSHE</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b1120;
      }

      #splash-canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse 80% 60% at 50% 40%, #1a2a45 0%, #0b1120 70%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        animation: splashFadeIn 0.6s ease both;
      }

      @keyframes splashFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      .logo-ring {
        position: relative;
        width: 110px;
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 28px;
      }

      .logo-ring::before,
      .logo-ring::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(59, 130, 246, 0.25);
        animation: ringPulse 2.4s ease-in-out infinite;
      }

      .logo-ring::after {
        inset: -14px;
        border-color: rgba(99, 102, 241, 0.15);
        animation-delay: 0.8s;
      }

      @keyframes ringPulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50%       { opacity: 1;   transform: scale(1.06); }
      }

      .logo-img {
        width: 82px;
        height: 82px;
        object-fit: contain;
        border-radius: 20px;
        box-shadow:
          0 0 0 1px rgba(59,130,246,0.18),
          0 12px 48px rgba(59, 130, 246, 0.40),
          0 4px 16px rgba(0,0,0,0.5);
        animation: logoBob 3s ease-in-out infinite;
        background: rgba(255,255,255,0.04);
        padding: 6px;
      }

      @keyframes logoBob {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-5px); }
      }

      .brand {
        text-align: center;
        margin-bottom: 36px;
        animation: brandSlideUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.15s both;
      }

      @keyframes brandSlideUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .brand-title {
        font-size: 18px;
        font-weight: 700;
        color: #f1f5f9;
        letter-spacing: -0.025em;
        line-height: 1.3;
      }

      .brand-title .accent {
        background: linear-gradient(90deg, #60a5fa, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .brand-divider {
        width: 32px;
        height: 2px;
        background: linear-gradient(90deg, #3b82f6, #6366f1);
        border-radius: 99px;
        margin: 8px auto;
        opacity: 0.7;
      }

      .brand-sub {
        font-size: 12px;
        color: #475569;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 500;
      }

      .progress-track {
        width: 160px;
        height: 3px;
        background: rgba(255,255,255,0.07);
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 14px;
        animation: brandSlideUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.25s both;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3b82f6, #818cf8);
        border-radius: 99px;
        animation: fillBar 2.2s cubic-bezier(0.4,0,0.2,1) 0.4s forwards;
      }

      @keyframes fillBar {
        0%   { width: 0%;   opacity: 1; }
        80%  { width: 92%;  opacity: 1; }
        95%  { width: 100%; opacity: 1; }
        100% { width: 100%; opacity: 0.4; }
      }

      .status-text {
        font-size: 12px;
        color: #475569;
        font-weight: 500;
        letter-spacing: 0.01em;
        animation: brandSlideUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.3s both;
        min-height: 18px;
      }

      .dots {
        display: inline-flex;
        gap: 4px;
        margin-left: 6px;
        vertical-align: middle;
      }

      .dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #3b82f6;
        display: inline-block;
        animation: dotBounce 1.2s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.2s; }
      .dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes dotBounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40%            { transform: translateY(-5px); opacity: 1; }
      }

      #root {
        position: relative;
        z-index: 2;
      }
    </style>
  </head>
  <body>

    <canvas id="splash-canvas"></canvas>

    <div id="initial-splash">
      <div class="logo-ring">
        <img class="logo-img" src="/logo-wki.png" alt="WKI Logo" />
      </div>

      <div class="brand">
        <div class="brand-title">
          Pengendalian &amp; <span class="accent">QSHE WKI</span>
        </div>
        <div class="brand-divider"></div>
        <div class="brand-sub">Waskita Infrastruktur</div>
      </div>

      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>

      <div class="status-text" id="splash-status">
        Memuat sistem
        <span class="dots"><span></span><span></span><span></span></span>
      </div>
    </div>

    <div id="root"></div>

    <script>
      /* ── Particle canvas ── */
      (function () {
        const canvas = document.getElementById('splash-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, particles = [], raf;

        function resize() {
          W = canvas.width  = window.innerWidth;
          H = canvas.height = window.innerHeight;
        }

        function rand(a, b) { return a + Math.random() * (b - a); }

        function init() {
          particles = [];
          const count = Math.min(Math.floor((W * H) / 14000), 60);
          for (let i = 0; i < count; i++) {
            particles.push({
              x: rand(0, W), y: rand(0, H),
              r: rand(0.8, 2.2),
              dx: rand(-0.18, 0.18),
              dy: rand(-0.12, 0.12),
              o: rand(0.08, 0.35),
              color: Math.random() > 0.5 ? '59,130,246' : '99,102,241',
            });
          }
        }

        function draw() {
          ctx.clearRect(0, 0, W, H);
          particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.color},${p.o})`;
            ctx.fill();
            p.x += p.dx; p.y += p.dy;
            if (p.x < -4) p.x = W + 4;
            if (p.x > W + 4) p.x = -4;
            if (p.y < -4) p.y = H + 4;
            if (p.y > H + 4) p.y = -4;
          });
          raf = requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => { resize(); init(); });
        resize(); init(); draw();

        const observer = new MutationObserver(() => {
          if (document.getElementById('root').childElementCount > 0) {
            cancelAnimationFrame(raf);
            canvas.style.transition = 'opacity 0.8s ease';
            canvas.style.opacity = '0';
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      })();

      /* ── Status text cycling ── */
      (function () {
        const el = document.getElementById('splash-status');
        const msgs = ['Memuat sistem', 'Menyiapkan autentikasi', 'Menginisialisasi dashboard'];
        let i = 0;
        const iv = setInterval(() => {
          i = (i + 1) % msgs.length;
          el.innerHTML = msgs[i] + ' <span class="dots"><span></span><span></span><span></span></span>';
        }, 1800);
        window._clearSplashInterval = () => clearInterval(iv);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
